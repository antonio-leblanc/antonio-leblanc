# Draws a year of GitHub activity as an ink river (https://github.com/monex00/nagare).
# Pinned to the reviewed commit: never @main — a moving ref would let the author's
# future code run inside this repo with contents:write.
name: nagare
on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: monex00/nagare@aa72e450767bbc847277e5d9d378cfbbf23c6346
        with:
          # built-in token sees public activity only; add a NAGARE_TOKEN secret
          # (fine-grained PAT, read-only repository contents) to include private
          # activity as an unnamed current.
          token: ${{ secrets.NAGARE_TOKEN || github.token }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nagare/nagare.svg
          git diff --cached --quiet || git commit -m "Redraw nagare"
          git push
